name: Multi-Platform Build

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: windows
            static_runtime: "ON"
            binary_path: build/src/Release/step_viewer.exe
          - os: macos-latest
            artifact_name: macos
            static_runtime: "OFF"
            binary_path: build/src/step_viewer.app
          - os: ubuntu-latest
            artifact_name: ubuntu
            static_runtime: "ON"
            binary_path: build/src/step_viewer

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Building OpenCascade takes most of the build time, cache it
      - name: Cache OpenCascade
        uses: actions/cache@v4
        with:
          path: build/_occt
          key: occt-${{ matrix.os }}-${{ hashFiles('cmake/occt.cmake') }}

      - name: Install Dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev \
            libwayland-dev libgtk-3-dev pkg-config

      - name: Install LLVM (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install llvm
          LLVM_PREFIX=$(brew --prefix llvm)
          echo "CC=$LLVM_PREFIX/bin/clang" >> $GITHUB_ENV
          echo "CXX=$LLVM_PREFIX/bin/clang++" >> $GITHUB_ENV
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV
          
          # We define the paths for the CMakeLists.txt to use
          # This avoids passing them as "flags" which break the C-compiler test
          echo "LIBCXX_PATH=$LLVM_PREFIX/lib/libc++.a" >> $GITHUB_ENV
          echo "LIBCXXABI_PATH=$LLVM_PREFIX/lib/libc++abi.a" >> $GITHUB_ENV
          
          echo "LDFLAGS=-L$LLVM_PREFIX/lib" >> $GITHUB_ENV
          echo "CPPFLAGS=-I$LLVM_PREFIX/include" >> $GITHUB_ENV

      - name: Configure CMake
        run: >
          cmake -B build 
          -DCMAKE_BUILD_TYPE=Release 
          -DSTATIC_RUNTIME=${{ matrix.static_runtime }}
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          ${{ matrix.os == 'macos-latest' && format('-DCMAKE_SYSROOT={0}', env.SDKROOT) || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare Artifacts
        shell: bash
        run: |
          mkdir staging
          cp -r ${{ matrix.binary_path }} staging/

      - name: Ad-hoc Sign (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          codesign --force --deep --sign - staging/step_viewer.app

      - name: Strip Binaries (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: strip staging/step_viewer

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: step_viewer-${{ matrix.artifact_name }}
          path: staging/
          if-no-files-found: error
